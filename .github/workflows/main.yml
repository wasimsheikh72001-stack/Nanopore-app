name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: |
          ls -la
          unzip -o "$(ls nanopore-capacitor-git*.zip | head -1)"
          ls -la capacitor-github
      - name: Install packages
        working-directory: capacitor-github
        run: npm install --legacy-peer-deps
      - name: Add Android project
        working-directory: capacitor-github
        run: npx cap add android
      - name: App icon (optional)
        continue-on-error: true
        working-directory: capacitor-github
        run: npx capacitor-assets generate --android
      - name: Copy web app into Android
        working-directory: capacitor-github
        run: npx cap sync android
      - name: Build debug APK
        working-directory: capacitor-github/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nanopore-analyzer-apk
          path: capacitor-github/android/app/build/outputs/apk/debug/app-debug.apk
