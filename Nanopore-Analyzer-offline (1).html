<style>
/* Layout: sticky app bar (menu, logo, tabs); Files = batch grid; Analysis = one trace; Final analysis = overlay, parameter table, four plots, AI, report. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#f5f7fa; --ink:#111c27; --muted:#56677a; --line:#d5dde6;
  --accent:#12508f; --accent-ink:#ffffff; --accent-soft:#e1ecf8; --warn:#9a4a05; --warn-soft:#fdeedd;
  --plot:#ffffff; --grid:#e3e9ee; --axis:#2a3640;
  --c-trace:#1f5fbf; --c-base:#1f9a4d; --c-min:#d93636; --c-start:#8a3fc4; --c-end:#e08a00;
  --font:'Inter','Noto Sans Bengali','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; --fs:15px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c131a; --surface:#142029; --surface2:#1a2832; --ink:#e7eef4; --muted:#93a5b4; --line:#2a3a47;
  --accent:#6cb4ff; --accent-ink:#04182c; --accent-soft:#16304a; --warn:#f0a35e; --warn-soft:#38271a;
  --plot:#0f1a22; --grid:#233140; --axis:#b4c2cd;
  --c-trace:#6aa5ff; --c-base:#4ade80; --c-min:#ff6b6b; --c-start:#c084fc; --c-end:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131a; --surface:#142029; --surface2:#1a2832; --ink:#e7eef4; --muted:#93a5b4; --line:#2a3a47;
  --accent:#6cb4ff; --accent-ink:#04182c; --accent-soft:#16304a; --warn:#f0a35e; --warn-soft:#38271a;
  --plot:#0f1a22; --grid:#233140; --axis:#b4c2cd;
  --c-trace:#6aa5ff; --c-base:#4ade80; --c-min:#ff6b6b; --c-start:#c084fc; --c-end:#fbbf24; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.5;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:var(--surface);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{border-color:var(--accent)}
.logo{flex:none;display:block}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.brand b{font-size:1.15em;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand span{font-size:.82em;color:var(--muted);line-height:1.3}
.tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);padding:3px;border-radius:9px;max-width:100%;overflow-x:auto}
.tabs button{font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:.92em;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select.btn{padding-right:6px}
.btn:disabled{opacity:.5;cursor:default}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(5,12,20,.5);z-index:40}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,92vw);z-index:41;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
#drawer h2{margin:0;font-size:1.1em}
#drawer h4{margin:6px 0 0;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.88em;color:var(--muted)}
.field input,.field select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.pair{display:flex;gap:8px}
.pair input{min-width:0;width:50%}
/* uploads and notes */
.upload{display:flex;flex-direction:column;gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:10px;background:var(--surface);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-weight:600;font-size:1.05em}
.drop small{display:block;color:var(--muted);margin-top:2px}
.pick{position:relative;display:inline-block;overflow:hidden}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.92em}
.dev{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.dev img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.dev b{font-size:1.05em}.dev .deg{font-size:.85em;color:var(--accent);font-weight:600}.dev p{margin:2px 0 0;font-size:.85em;color:var(--muted);line-height:1.5}
.seg{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);padding:3px;border-radius:9px;max-width:100%;width:fit-content;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.93em;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.88em;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{font-size:1.05em;color:var(--fg)}
.fld input[type=text],.fld input[type=number],.fld select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);min-width:0;width:100%}
.pubwrap{overflow-x:auto;max-width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.pubwrap canvas{display:block}
.dgwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px;background:#fff;-webkit-overflow-scrolling:touch}
.dgwrap canvas{display:block}
.dgsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.dgstep{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface2);min-width:0}
.dgstep>b{display:block;margin-bottom:8px;font-size:.9em}
.dgcal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dgcal>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.dgcal input,#cmpTable td input{padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface);width:100%;min-width:0;font-variant-numeric:tabular-nums}
#cmpTable td input{width:96px;text-align:right}
.dgtool.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sw{display:inline-block;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);vertical-align:middle}
.mini{display:flex;gap:6px;align-items:center;font-size:.88em;color:var(--muted)}
.v-ok{color:#1b7f3b;font-weight:600}.v-near{color:var(--warn);font-weight:600}.v-bad{color:#c62828;font-weight:600}
details>summary{font-weight:600;font-size:.93em}
.pz{min-height:70px;border:2px dashed var(--accent);border-radius:8px;padding:12px;margin-bottom:8px;color:var(--muted);outline:none}.pz:empty::before{content:attr(data-ph)}.pz img{max-width:100%}
.cin{width:38px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.palsw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.palsw:hover{outline:2px solid var(--accent)}
.hint{font-size:.85em;color:var(--muted);margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h3{margin:0;font-size:.82em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* file grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fcard canvas{width:100%;height:96px;border-radius:6px}
.fcard .t{display:flex;justify-content:space-between;gap:6px;align-items:center}
.fcard .t b{font-weight:600;font-size:.92em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fcard .m{font-size:.8em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.fcard .x{border:0;background:transparent;color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:50%;flex:none}
.fcard .x:hover{background:var(--line)}
.fcard .open{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-align:left;font-size:.85em}
/* analysis */
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:minmax(0,1fr)}}
.chartbox{position:relative;width:100%;height:460px}
.chartbox.sm{height:300px}
@media (max-width:600px){.chartbox{height:340px}.chartbox.sm{height:260px}}
canvas{display:block;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row label{flex:1;font-size:.92em;color:var(--muted)}
.row input[type=number],.row select{width:112px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);font-family:var(--mono);font-size:.9em;text-align:right}
.row select{font-family:var(--font);text-align:left;width:170px}
input.edited{border-color:var(--warn)!important;background:var(--warn-soft)!important}
.row .u{width:28px;font-size:.8em;color:var(--muted);font-family:var(--mono)}
.range{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.range label{font-size:.92em;color:var(--muted)}
.range input[type=range]{flex:1;accent-color:var(--accent)}
.range output{font-family:var(--mono);font-size:.9em;width:44px;text-align:right}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
table{border-collapse:collapse;width:100%;font-size:.93em}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.85em;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;max-width:100%}
#studyTable td input{width:92px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);text-align:right;font-variant-numeric:tabular-nums}
#studyTable td.th-col{color:var(--muted);font-variant-numeric:tabular-nums}
#studyTable td input.lab{width:150px;text-align:left}
.ai{white-space:pre-wrap;font-size:.95em;margin-top:10px;padding:12px 14px;background:var(--surface2);border-radius:8px;border:1px solid var(--line)}
.plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.plots{grid-template-columns:minmax(0,1fr)}}
.plot{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);resize:vertical;font-size:.95em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.92em;z-index:50;max-width:90vw}
.dl{display:flex;gap:6px;flex-wrap:wrap}
.dl a{color:var(--accent);font-weight:600;word-break:break-all}
.stack{display:flex;flex-direction:column;gap:16px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.chk{display:flex;gap:8px;align-items:center;font-size:.92em;cursor:pointer}
.formula{white-space:pre-wrap;font-family:var(--mono);font-size:.82em;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.5}
.pill{display:inline-block;margin-top:3px;padding:1px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:.75em;font-weight:600;width:fit-content}
.sub{margin:16px 0 8px;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.out{display:block;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--accent-soft);font-family:var(--mono);font-weight:600}
</style>

/* ===== Core: parsing and analysis (no DOM) ===== */
const NUM_RE = /[-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?/g;

function parseLines(lines) {
  const rows = [];
  let skipped = 0;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    const nums = line.match(NUM_RE);
    if (!nums || nums.length < 2) { skipped++; continue; }
    const rest = line.replace(NUM_RE, '').replace(/[\s,;:|()\[\]\/\\-]/g, '');
    if (rest.length > 24) { skipped++; continue; }
    const v = nums.map(parseFloat);
    if (!v.every(isFinite)) { skipped++; continue; }
    rows.push(v);
  }
  /* tables exported by this app: "# t I" (one block) or "# t I # t I" (two blocks side by side) -> drop the running index numbers */
  const isInt = x => Math.abs(x - Math.round(x)) < 1e-9;
  const n6 = rows.filter(r => r.length === 6), n3 = rows.filter(r => r.length === 3);
  const okRow = r => isInt(r[0]) && isInt(r[3]) && r[0] >= 1 && r[3] > r[0] && r[0] < 1e6, two = n6.length >= rows.length * 0.8 && n6.filter(okRow).length >= n6.length * 0.95;
  let idx3 = false;
  if (!two && n3.length >= rows.length * 0.8 && n3.length > 3) { let ok = 0; for (let i = 1; i < n3.length; i++) if (isInt(n3[i][0]) && n3[i][0] === n3[i - 1][0] + 1) ok++; idx3 = ok >= (n3.length - 1) * 0.95; }
  const t = [], c = [];
  for (const r of rows) {
    if (two) { if (r.length === 6 && okRow(r)) { t.push(r[1], r[4]); c.push(r[2], r[5]); } else if (r.length === 3 && isInt(r[0]) && r[0] >= 1 && r[0] < 1e6) { t.push(r[1]); c.push(r[2]); } }
    else if (idx3) { if (r.length === 3) { t.push(r[1]); c.push(r[2]); } }
    else { t.push(r[0]); c.push(r[1]); }
  }
  const ord = t.map((_, i) => i).sort((i, j) => t[i] - t[j]);
  return { t: ord.map(i => t[i]), c: ord.map(i => c[i]), skipped };
}

function docxLines(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const lines = [];
  const name = n => n.localName;
  function paraLines(p) {
    const out = []; let cur = '';
    (function walk(n) {
      for (const ch of n.childNodes) {
        if (ch.nodeType !== 1) continue;
        const ln = name(ch);
        if (ln === 't') cur += ch.textContent;
        else if (ln === 'tab') cur += ' ';
        else if (ln === 'br' || ln === 'cr') { out.push(cur); cur = ''; }
        else if (ln !== 'txbxContent') walk(ch);
      }
    })(p);
    out.push(cur);
    return out;
  }
  function visit(n) {
    for (const ch of n.childNodes) {
      if (ch.nodeType !== 1) continue;
      const ln = name(ch);
      if (ln === 'p') lines.push(...paraLines(ch));
      else if (ln === 'tr') {
        const cells = [];
        for (const tc of ch.childNodes) {
          if (tc.nodeType === 1 && name(tc) === 'tc') {
            const parts = [];
            (function collect(x) {
              for (const y of x.childNodes) {
                if (y.nodeType !== 1) continue;
                if (name(y) === 'p') parts.push(paraLines(y).join(' '));
                else collect(y);
              }
            })(tc);
            cells.push(parts.join(' '));
          }
        }
        lines.push(cells.join(' '));
      } else visit(ch);
    }
  }
  visit(doc.documentElement);
  return lines;
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('লাইব্রেরি লোড হয়নি')); document.head.appendChild(s); });

async function pdfLines(buf) {

    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

}

async function readFileToData(file) {

/* radius, length, base pairs and voltage from a name like trial_5_10_500bp_0.1V (conical: tip_base_length_...) */
function parseName(name) {
  const base = name.replace(/\.[^.]+$/, '');

/* auto values for a file, from its settings */
function autoValues(f) {

/* effective values: manual override beats auto */
function effective(f) {

/* ten example cases (radius 3 to 12 nm), generated, not real measurements */

const blobOf = (cv, type, q) => new Promise(r => cv.toBlob(r, type, q));

async function makePdf(items) {

  begin(2); push('<< /Type /Pages /Count ' + imgs.length + ' /Kids [' + imgs.map((_, i) => (3 + i * 3) + ' 0 R').join(' ') + '] >>\nendobj\n');
  imgs.forEach((im, i) => {

    begin(p + 1); push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    begin(p + 2); push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.d.length} >>\nstream\n`); push(im.d); push('\nendstream\nendobj\n');

  push(`trailer\n<< /Size ${N + 1} /Root 1 0 R >>\nstartxref\n${xpos}\n%%EOF`);

}

  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

const MIME = { png: 'image/png', jpg: 'image/jpeg', pdf: 'application/pdf', csv: 'text/csv', zip: 'application/zip', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };
function fallbackSave(name, data) {
  const ext = name.split('.').pop().toLowerCase();
  const blob = data instanceof Blob ? data : new Blob([data], { type: MIME[ext] || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); try { a.click(); } catch (e) {} a.remove();
  const row = document.createElement('div'); row.className = 'dl';
  const dlA = document.createElement('a'); dlA.href = url; dlA.download = name; dlA.textContent = '⬇ ' + name + ' (' + Math.max(1, Math.round(blob.size / 1024)) + ' KB)'; row.append(dlA);
  if (['png', 'jpg', 'pdf'].includes(ext)) { const o = document.createElement('a'); o.href = url; o.target = '_blank'; o.rel = 'noopener'; o.textContent = '· ' + t('files.open'); row.append(o); }
  $('#dlList').prepend(row); $('#dlPanel').hidden = false;
  toast(t('toast.made'));
  $('#dlPanel').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
/* Android app made with Capacitor: a WebView ignores <a download>, so write the file with the Filesystem plugin and open the Share sheet (needs @capacitor/filesystem and @capacitor/share) */
async function nativeSave(name, data) {
  try {
    const C = window.Capacitor; if (!C || !(C.isNativePlatform ? C.isNativePlatform() : false)) return false;
    const FS = C.Plugins && C.Plugins.Filesystem, SH = C.Plugins && C.Plugins.Share; if (!FS) return false;
    const blob = data instanceof Blob ? data : new Blob([data], { type: MIME[name.split('.').pop().toLowerCase()] || 'application/octet-stream' });
    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
    const w = await FS.writeFile({ path: name, data: b64, directory: 'CACHE' });
    if (SH) { try { await SH.share({ title: name, dialogTitle: name, url: w.uri }); } catch (e) { if (e && /cancel/i.test(String(e.message || e))) return true; throw e; } }
    toast(t('toast.saved')); return true;
  } catch (e) { return false; }
}
async function claude_use(n) { try { return window.claude ? await window.claude.use(n) : null; } catch (e) { return null; } }
async function saveBlob(dl, name, data) {
  if (!dl) { if (await nativeSave(name, data)) return; fallbackSave(name, data); return; }
  try { await dl.save({ filename: name, data }); toast(t('toast.saved')); }
  catch (e) { if (e && e.code === 'declined') return; fallbackSave(name, data); }
}

/* one question to the chosen provider; onText gets the text so far; rejects with {msg} */
async function aiAsk(prompt, onText, images = [], noImg = false) {
  if (noImg) images = [];
  const prov = AI.prov;
  if (prov === 'builtin') {
    const s = await claude_use('sample'); if (!s) throw { msg: t('ai.off') };
    const o = { onText: ({ text }) => onText(text) };
    if (images.length) { try { const lim = await s.limits(); if (lim && lim.images) o.images = images.map(i => { const bin = atob(i.b64), u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return new Blob([u], { type: i.mime }); }); } catch (e) {} }
    const r = await s(prompt, o); return r.text;
  }
  if (window.claude) throw { msg: t('ai.inClaude') };
  const key = (AI.keys[prov] || '').trim(); if (!key) throw { msg: t('ai.noKey') };
  const model = (AI.models[prov] || AI_MODELS[prov]).trim(), json = { 'content-type': 'application/json' };
  let url, headers, body, pick;
  if (prov === 'anthropic') {
    url = 'https://api.anthropic.com/v1/messages';
    headers = { ...json, 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
    body = { model, max_tokens: 2000, messages: [{ role: 'user', content: images.length ? [...images.map(i => ({ type: 'image', source: { type: 'base64', media_type: i.mime, data: i.b64 } })), { type: 'text', text: prompt }] : prompt }] };
    pick = j => (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  } else if (prov === 'gemini') {
    url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent';
    headers = { ...json, 'x-goog-api-key': key };
    body = { contents: [{ parts: [...images.map(i => ({ inlineData: { mimeType: i.mime, data: i.b64 } })), { text: prompt }] }] };
    pick = j => ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || '').join('');
  } else {
    url = prov === 'xai' ? 'https://api.x.ai/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
    headers = { ...json, Authorization: 'Bearer ' + key };
    body = { model, messages: [{ role: 'user', content: images.length ? [{ type: 'text', text: prompt }, ...images.map(i => ({ type: 'image_url', image_url: { url: 'data:' + i.mime + ';base64,' + i.b64 } }))] : prompt }] };
    pick = j => (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
  }
  let res;
  try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) }); } catch (e) { throw { msg: navigator.onLine === false ? t('ai.noNet') : t('ai.blocked') }; }
  if (!res.ok) {
    if (images.length && (res.status === 400 || res.status === 422)) return aiAsk(prompt, onText, [], true);
    let m = ''; try { const j = await res.json(); m = (j.error && (j.error.message || j.error)) || JSON.stringify(j); } catch (e) {}
    throw { msg: t('ai.http', res.status, String(m).slice(0, 200)) };
  }
  const text = pick(await res.json()); if (!text) throw { msg: t('ai.empty') };
  onText(text); return text;
}

  const T = liveTheme();
  { const { ctx, w, h } = setupCanvas($('#ovChart')); drawOv(ctx, w, h, T); }
  $('#ovNote').textContent = S.ovScale === 'auto' ? t('ov.autoNote', ovMode() === 'multi' ? 'raw' : ovMode()) : '';
  const specs = plotSpecs(T); document.querySelectorAll('#plots canvas').forEach((cv, i) => { const { ctx, w, h } = setupCanvas(cv); drawSeries(ctx, w, h, specs[i], T); });
}

/* ----- export items ----- */
function bigCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
function itemOne(f) { const cv = bigCanvas(2400, 1500); drawAnalysis(cv.getContext('2d'), 2400, 1500, f, lightTheme(), S.units, { scale: 2.2 }); return { title: f.label, cv, lines: resultsText(f).split('\n').filter(l => !l.startsWith('===')) }; }
function itemOverlay() { const cv = bigCanvas(2400, 1500); drawOv(cv.getContext('2d'), 2400, 1500, lightTheme(), { scale: 2.2 }); return { title: t('fin.traces'), cv }; }
function plotItems() { const specs = plotSpecs(lightTheme()); return specs.map(sp => { const cv = bigCanvas(2000, 1200); drawSeries(cv.getContext('2d'), 2000, 1200, sp, lightTheme(), { scale: 2 }); return { title: sp.title, cv }; }); }
function itemTable() { const head = tableHead(), rows = tableRowsText().map(r => r.map(String)); return { title: t('fin.table'), cv: renderTableCanvas(head, rows, t('fin.table')), table: { head, rows } }; }
function itemAI() { return S.ai ? { title: t('fin.ai'), cv: textCanvas(t('fin.ai'), S.ai), lines: S.ai.split('\n'), textOnly: true } : null; }
const lightTheme = () => ({ ...LIGHT, font: FIG.font, mono: FIG.mono });
function csvText() {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  return '﻿' + [tableHead().map(q).join(','), ...tableRowsText().map(r => r.map((c, i) => i === 1 ? q(c) : c).join(','))].join('\n');
}
const base = n => n + '_' + new Date().toISOString().slice(0, 10);

/* ----- AI ----- */
async function analyzeAll() {
  const out = $('#aiFinal'), rows = studyRows(); out.hidden = false;
  if (!rows.length) { out.textContent = t('ai.need'); return; }
  out.textContent = t('ai.working');
  const uT = S.units.t, uI = S.units.i;
  const lines = rows.map(r => {
    const th = r.th, dev = isFinite(th) ? ((r.v.base - th) / th * 100).toFixed(1) + '%' : 'n/a', tr = theoryRatio(r.f.p);
    return `row ${r.i + 1} | r=${pv(r.f.p.r)} nm${SET.shape === 'cone' ? ' (tip) | r_base=' + pv(r.f.p.rb) + ' nm' : ''} | L=${pv(r.f.p.L)} nm | ${pv(r.f.p.bp)} bp | ${pv(r.f.p.V)} V | I0_sim=${num(r.v.base)} ${uI} | I0_theory=${isFinite(th) ? num(th) : 'n/a'} (deviation ${dev}) | dt=${num(r.v.dt, 3)} ${uT} | dI=${num(r.v.dI)} ${uI} | dI/I0=${num(r.v.dI / r.v.base)} | simple-theory dI/I0=${isFinite(tr) ? num(tr) : 'n/a'} | min current at ${num(r.v.tmin, 2)} ${uT}`;
  });
  const prompt = `You are helping a researcher analyze molecular-dynamics or continuum simulations of DNA translocation through a cylindrical nanopore, for a thesis.
Model used for the theoretical open-pore current: ${SET.shape === 'custom' ? 'custom formula G = ' + SET.expr + ' (SI units), I0 = G*V' : SET.shape === 'cone' ? 'conical pore, G = sigma / (4L/(pi d_tip d_base) + ' + (SET.formula === 'plain' ? '0' : '1/(2 d_tip) + 1/(2 d_base)') + '), I0 = G*V' : (SET.formula === 'hall' ? 'cylindrical pore, Hall approximation I0 = pi r^2 sigma V / (L + 1.6 r)' : 'cylindrical pore, G = sigma / (4L/(pi d^2) + ' + (SET.formula === 'plain' ? '0' : '1/d') + '), I0 = G*V, d = 2r')}; sigma = ${SET.sigma} S/m. Experimental I0 is the mean of the open-pore current before and after the event. DNA diameter assumed for the simple blockade estimate dI/I0 ~ (d_DNA/d)^2: ${SET.dna} nm. Translocation window threshold: ${Math.round(S.files[0].set.frac * 100)}% of the blockade depth.
Results (one row per simulation file):
${lines.join('\n')}
${$('#notes').value.trim() ? '\nNotes and expected values from the paper:\n' + $('#notes').value.trim() + '\n' : '\nNo paper notes were provided; compare against the theoretical model above and general nanopore physics.\n'}
Write the analysis in ${t('aiLang')}. Use short plain-text sections with these headings: 1) Overall trends, 2) What matches the theory or paper, 3) What does not match and the likely causes, 4) What to do next. Refer to rows by number and give numbers. Typical causes to consider: threshold choice, noisy or short windows, access resistance, surface charge and ion concentration, DNA conformation or length versus pore length, voltage-dependent speed, simulation box or boundary effects. If the data cannot support a conclusion, say so. Keep it under 350 words. No tables.`;
  try { const text = await aiAsk(prompt, x => { out.textContent = x; }); S.ai = text; out.textContent = text; }
  catch (e) { out.textContent = (e && e.msg) || t('ai.fail'); }
}
async function explain() {
  const f = cur(), box = $('#aiOut'); box.hidden = false; box.textContent = t('ai.working');
  const v = effective(f);
  const prompt = `Explain this nanopore translocation result briefly (5 to 7 lines, thesis style) in ${t('aiLang')}. Say what percent blockade depth it is (dI/baseline), how long the event is, what the fluctuations in current suggest, and any warning.\nBaseline=${v.base.toFixed(3)} ${S.units.i}, Min=${v.imin.toFixed(3)} ${S.units.i} at ${v.tmin.toFixed(2)} ${S.units.t}, dI=${v.dI.toFixed(3)}, Start=${v.ts.toFixed(2)}, End=${v.te.toFixed(2)}, dt=${v.dt.toFixed(2)} ${S.units.t}, threshold=${Math.round(f.set.frac * 100)}%.`;
  try { const text = await aiAsk(prompt, x => { box.textContent = x; }); box.textContent = text; } catch (e) { box.textContent = (e && e.msg) || t('ai.fail'); }
}

/* ----- init ----- */
function bindEvents() {
  const inp = $('#fileInput'), drop = $('#drop');
  inp.addEventListener('change', () => { addFiles([...inp.files]); inp.value = ''; });
  ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', ev => addFiles([...ev.dataTransfer.files]));
  $('#pasteBtn').onclick = () => { $('#pastePanel').hidden = !$('#pastePanel').hidden; };
  $('#pasteClose').onclick = () => { $('#pastePanel').hidden = true; }; $('#pasteGo').onclick = addPasted;
  $('#btnClear').onclick = () => { S.files = exampleSet(); S.cur = 0; renderAll(); };
  ['files', 'analysis', 'final'].forEach(n => { $('#tab-' + n).onclick = () => setTab(n); });
  $('#fileSel').onchange = e => { S.cur = +e.target.value; renderAll(); };
  $('#btnPrev').onclick = () => { S.cur = (S.cur - 1 + S.files.length) % S.files.length; renderAll(); };
  $('#btnNext').onclick = () => { S.cur = (S.cur + 1) % S.files.length; renderAll(); };
  $('#selBase').onchange = e => { cur().set.method = e.target.value; refresh(); };
  $('#rngFrac').oninput = e => { cur().set.frac = e.target.value / 100; refresh(); };
  $('#preMid').onclick = () => { cur().set.frac = .5; refresh(); }; $('#preEdge').onclick = () => { cur().set.frac = .1; refresh(); };
  $('#btnReset').onclick = () => { const f = cur(); f.manual = {}; f.set.wStart = f.set.wEnd = null; refresh(); toast(t('toast.reset')); };
  $('#btnPng').onclick = () => exportItems([itemOne(cur())], $('#fmt').value, 'Nanopore_' + safeName(cur().label));
  $('#btnAll').onclick = () => exportItems(S.files.filter(f => !effective(f).empty).map(itemOne), $('#fmt').value, base('Nanopore_all_graphs'));
  $('#btnCopy').onclick = async () => { const txt = resultsText(cur()); try { await navigator.clipboard.writeText(txt); toast(t('toast.copied')); } catch (e) { const a = $('#aiOut'); a.hidden = false; a.textContent = txt; toast(t('toast.copyHere')); } };
  $('#btnAi').onclick = explain;
  /* final analysis */
  $('#btnOvSave').onclick = () => exportItems([itemOverlay()], $('#ovFmt').value, base('All_traces'));
  $('#btnOvEach').onclick = () => exportItems(S.files.filter(f => !effective(f).empty).map(itemOne), $('#ovFmt').value, base('Each_trace'));
  $('#studyTable').addEventListener('input', e => { if (e.target.matches('input')) onStudyInput(e.target); });
  $('#btnReparse').onclick = () => { S.files.forEach(f => { f.p = parseName(f.name); }); renderStudy(); drawFinal(); renderGrid(); toast(t('toast.parsed')); };
  $('#btnTblSave').onclick = async () => { const f = $('#tblFmt').value; if (f === 'csv') saveBlob(await claude_use('downloads'), base('Nanopore_table') + '.csv', csvText()); else exportItems([itemTable()], f, base('Nanopore_table')); };
  $('#ovScale').onchange = e => { S.ovScale = e.target.value; drawFinal(); };
  $('#ovAlign').onchange = e => { S.ovAlign = e.target.checked; drawFinal(); };
  bindTheory();
  $('#xSel').onchange = e => { S.xmode = e.target.value; drawFinal(); };
  $('#btnPlSave').onclick = () => exportItems(plotItems(), $('#plFmt').value, base('Nanopore_plots'));
  $('#btnAnalyze').onclick = analyzeAll;
  $('#btnReport').onclick = () => {
    const items = [itemTable(), ...plotItems(), itemOverlay(), ...S.files.filter(f => !effective(f).empty).map(itemOne)]; const ai = itemAI(); if (ai) items.splice(5, 0, ai);
    exportItems(items, $('#repFmt').value, base('Nanopore_report'));
  };
  new ResizeObserver(() => drawAll()).observe(document.body);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawAll);
  new MutationObserver(drawAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
function init() {
  applySettings(); applyI18n(); buildFields(); buildPlots(); bindSettings(); bindEvents(); ppBind(); syncTheory(); buildProviders(); bindAI(); bindInstall();
  S.files = exampleSet(); S.cur = 0; renderAll();
}
init();
</script>
</body></html>
